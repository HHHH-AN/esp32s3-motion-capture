name: imu-current

on:
  push:
    branches: [main, ZBC, HAN, 'update/imu-*']
    paths: ['源代码/**', '.github/workflows/imu.yml']
  pull_request:
    paths: ['源代码/**', '.github/workflows/imu.yml']

permissions:
  contents: read

jobs:
  dashboard:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        variant: [imu, BLE, WIFI]
    defaults:
      run:
        working-directory: 源代码/${{ matrix.variant }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: node --check web/app.js

  firmware:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        variant: [imu, BLE, WIFI]
    defaults:
      run:
        working-directory: 源代码/${{ matrix.variant }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install platformio==6.1.19
      - if: matrix.variant == 'WIFI'
        run: cp include/wifi_config.example.h include/wifi_config.h
      - run: pio run
