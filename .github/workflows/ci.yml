name: ci

on:
  push:
    branches: [main, ZBC, HAN]
  pull_request:

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python 旧版/contracts/validate_contracts.py

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 旧版/pose/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install uv==0.8.13 -e ".[dev]"
      - run: uv lock --check
      - run: python -m ruff check .
      - run: python -m pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 旧版/pose/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: 旧版/pose/frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm build

  firmware:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 旧版/IMU-tracker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install platformio==6.1.19
      - run: pio test -e native
      - run: pio run -e node_usb
      - run: pio run -e node_fifo_lab
      - run: pio run -e node_ble
      - run: pio run -e node_espnow
      - run: pio run -e gateway_usb
      - run: pio run -e gateway_ble
