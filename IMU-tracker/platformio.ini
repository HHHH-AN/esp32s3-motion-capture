[platformio]
default_envs = node_usb

[env]
platform = espressif32@6.10.0
board = esp32-s3-mini-1u-n4r2
framework = arduino
board_build.arduino.memory_type = qio_qspi
board_build.partitions = partitions.csv
board_upload.flash_size = 4MB
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time
upload_speed = 921600
test_framework = unity
lib_ldf_mode = deep+
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DBOARD_HAS_PSRAM
    -DMOCAP_SAMPLE_RATE_HZ=100

[env:node_usb]
build_flags =
    ${env.build_flags}
    -DMOCAP_DEVICE_ROLE=1
    -DMOCAP_NODE_ID=1

[env:node_fifo_lab]
build_flags =
    ${env.build_flags}
    -DMOCAP_USE_ICM_INTERRUPT=1
    -DMOCAP_DEVICE_ROLE=1
    -DMOCAP_NODE_ID=1

[env:node_espnow]
build_flags =
    ${env.build_flags}
    -DMOCAP_DEVICE_ROLE=1
    -DMOCAP_NODE_ID=1
    -DMOCAP_ENABLE_ESPNOW=1

[env:node_ble]
build_flags =
    ${env.build_flags}
    -DMOCAP_DEVICE_ROLE=1
    -DMOCAP_NODE_ID=1
    -DMOCAP_ENABLE_BLE=1
lib_deps =
    h2zero/NimBLE-Arduino@1.4.3

[env:gateway_usb]
build_flags =
    ${env.build_flags}
    -DMOCAP_DEVICE_ROLE=2
    -DMOCAP_NODE_ID=0
    -DMOCAP_ENABLE_ESPNOW=1

[env:gateway_ble]
build_flags =
    ${env.build_flags}
    -DMOCAP_DEVICE_ROLE=2
    -DMOCAP_NODE_ID=0
    -DMOCAP_ENABLE_ESPNOW=1
    -DMOCAP_ENABLE_BLE=1
lib_deps =
    h2zero/NimBLE-Arduino@1.4.3

[env:native]
platform = native
framework =
test_framework = unity
test_build_src = yes
test_filter =
    test_protocol
    test_time_sync
build_src_filter =
    +<protocol/crc16.cpp>
    +<protocol/wire_codec.cpp>
    +<transport/ble/ble_fragmenter.cpp>
    +<node/time_sync.cpp>
build_flags =
    -std=gnu++17
    -Isrc
