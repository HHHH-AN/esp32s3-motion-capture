[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "mocap-pose"
version = "0.1.0"
description = "PC-side acquisition, fusion, synchronization and skeleton pipeline for the ESP32-S3 motion-capture system."
readme = {text = "Legacy motion-capture backend. See the repository documentation under 说明/旧版/pose/backend.", content-type = "text/plain"}
requires-python = ">=3.11"
dependencies = [
  "bleak==1.1.1",
  "fastapi==0.116.1",
  "numpy==2.3.2",
  "pydantic==2.11.7",
  "pyserial==3.5",
  "uvicorn[standard]==0.35.0",
]

[project.optional-dependencies]
dev = [
  "httpx==0.28.1",
  "pytest==8.4.1",
  "pytest-asyncio==1.1.0",
  "ruff==0.12.7",
]

[project.scripts]
mocap-server = "mocap_pose.scripts.run_server:main"
mocap-inspect = "mocap_pose.scripts.inspect_stream:main"
mocap-record = "mocap_pose.scripts.record_raw:main"
mocap-calibrate = "mocap_pose.scripts.calibrate_sensor:main"
mocap-replay-fusion = "mocap_pose.scripts.replay_fusion:main"
mocap-calibrate-mounting = "mocap_pose.scripts.calibrate_mounting:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mocap_pose"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

